[package]
name = "cloud-image-storage"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "cis"
path = "src/main.rs"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = { version = "1.0.100", optional = true }
axum = { version = "0.8.7", optional = true }
camino = { version = "1.2.1", features = ["serde1"], optional = true }
chrono = { version = "0.4.42", features = ["serde"], optional = true }
clap = { version = "4.5.53", features = ["derive", "env"], optional = true }
console_error_panic_hook = { version = "0.1.7", optional = true }
hex = { version = "0.4.3", optional = true }
leptos = { version = "0.8.9", default-features = false }
leptos_axum = { version = "0.8.9", optional = true }
leptos_meta = { version = "0.8.6", features = ["ssr"], optional = true }
leptos_router = { version = "0.8.12", features = ["ssr"], optional = true }
mime_guess = { version = "2.0.5", optional = true }
serde = { version = "1.0.228", features = ["derive"], optional = true }
serde_json = { version = "1.0.145", optional = true }
sha2 = { version = "0.10.9", optional = true }
tokio = { version = "1.48.0", features = ["fs", "macros", "net", "rt-multi-thread", "signal"], optional = true }
toml = { version = "0.9.8", optional = true }
tower-http = { version = "0.6.7", features = ["trace"], optional = true }
tracing = { version = "0.1.43", optional = true }
tracing-subscriber = { version = "0.3.22", features = ["env-filter"], optional = true }
uuid = { version = "1.18.1", features = ["serde", "v4"], optional = true }
walkdir = { version = "2.5.0", optional = true }
wasm-bindgen = { version = "0.2.106", optional = true }

[dev-dependencies]
tempfile = "3.23.0"

[features]
default = ["ssr"]
hydrate = [
    "dep:console_error_panic_hook",
    "dep:wasm-bindgen",
    "leptos/hydrate",
]
ssr = [
    "dep:anyhow",
    "dep:axum",
    "dep:camino",
    "dep:chrono",
    "dep:clap",
    "dep:hex",
    "dep:leptos_axum",
    "dep:leptos_meta",
    "dep:leptos_router",
    "dep:mime_guess",
    "dep:serde",
    "dep:serde_json",
    "dep:sha2",
    "dep:tokio",
    "dep:toml",
    "dep:tower-http",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:uuid",
    "dep:walkdir",
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
]

[package.metadata.leptos]
output-name = "cis"
bin-target = "cis"
bin-exe-name = "cis"
site-root = "target/site"
site-pkg-dir = "pkg"
assets-dir = "public"
style-file = "style/main.css"
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
